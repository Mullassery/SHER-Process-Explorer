[workspace]
resolver = "2"
members = [
    "crates/sher-pe-model",
    "crates/sher-pe-telemetry",
    "crates/sher-pe-intelligence",
    "crates/sher-pe-investigation",
    "crates/sher-pe-history",
    "crates/sher-pe-cli",
    "crates/sher-pe-gui",
    "crates/sher-pe-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/SHER-Process-Explorer"

[workspace.dependencies]
sher-pe-model = { path = "crates/sher-pe-model" }
sher-pe-telemetry = { path = "crates/sher-pe-telemetry" }
sher-pe-intelligence = { path = "crates/sher-pe-intelligence" }
sher-pe-investigation = { path = "crates/sher-pe-investigation" }
sher-pe-history = { path = "crates/sher-pe-history" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["sched", "signal", "user"] }
egui = "0.36"
eframe = "0.36"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
