[package]
name = "sher-pe-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The `sher` CLI for SHER Process Explorer."

[[bin]]
name = "sher"
path = "src/main.rs"

[dependencies]
sher-pe-model.workspace = true
sher-pe-telemetry.workspace = true
sher-pe-intelligence.workspace = true
sher-pe-investigation.workspace = true
sher-pe-history.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.deb]
name = "sher-process-explorer"
maintainer = "Georgi Mammen Mullassery <mullassery@gmail.com>"
copyright = "2026, SHER"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Evidence-based Linux process explorer. Answers what a process is doing \
and why, not just what top/ps show, with real /proc telemetry, \
perf/strace/eBPF sampling, container detection, and a deterministic \
investigation engine that always cites its evidence."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/sher", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/sher-process-explorer/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "sher-process-explorer"
license = "SHER Free Use & Proprietary Software License"
summary = "The `sher` CLI for SHER Process Explorer."
assets = [
    { source = "target/release/sher", dest = "/usr/bin/sher", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/sher-process-explorer/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/doc/sher-process-explorer/LICENSE", mode = "644", doc = true },
]
